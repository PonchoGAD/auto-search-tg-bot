upstream auto_search_api {
    server api:8000;
    keepalive 32;
}

upstream auto_search_bot_api {
    server bot-api:8100;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=bot_api_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;

    error_page 502 /_errors/502.json;
    error_page 503 /_errors/503.json;
    error_page 504 /_errors/504.json;

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /bot-api-health {
        proxy_pass http://auto_search_bot_api/api/v1/health/full;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /search-health {
        proxy_pass http://auto_search_api/api/v1/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /internal/ {
        return 403;
    }

    location /bot-api/internal/ {
        return 403;
    }

    location /bot-api/api/v1/internal/ {
        return 403;
    }

    location /api/v1/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://auto_search_api/api/v1/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /bot-api/api/v1/ {
        limit_req zone=bot_api_limit burst=20 nodelay;

        proxy_pass http://auto_search_bot_api/api/v1/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /_errors/502.json {
        internal;
        default_type application/json;
        return 502 '{"status":"error","code":502,"message":"Bad gateway. Upstream service is unavailable."}';
    }

    location = /_errors/503.json {
        internal;
        default_type application/json;
        return 503 '{"status":"error","code":503,"message":"Service unavailable."}';
    }

    location = /_errors/504.json {
        internal;
        default_type application/json;
        return 504 '{"status":"error","code":504,"message":"Gateway timeout. Upstream service did not respond in time."}';
    }
}